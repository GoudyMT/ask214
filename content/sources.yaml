# Sources-of-Truth Registry (master spec section 8.1) - the LEGAL RECORD for every corpus source.
# 17 USC 105 US-Government public-domain work ONLY. Reviewed at first inclusion + on every change.
# Cycle C sample corpus: a thin, deliberately-clean set to prove retrieval works end-to-end.
# DAV guide (nonprofit, copyrighted), TAP curriculum (contractor gray zone), and CAC-gated
# instructions are EXCLUDED from the sample per section 8.3/8.4 - revisit with verification in cycle A.
#
# A1 schema (2026-06-20): a non-excluded entry requires legal_tier + content_type + a terms-of-use
# review (terms_reviewed_date/_notes) in addition to the copyright review (reviewed_by/_date). Capture
# fields (content_hash/captured_path/captured_at/robots_allowed) are populated by A2's real capture.
# Validate with `pnpm validate:sources`. HTML sources are NEVER re-hosted (served PDFs only, A1-D2).

