# gitleaks secret-scan config. The authoritative gate runs in CI (.github/workflows/ci.yml).
# Guards a PUBLIC repo (AGPL-3.0): no Cloudflare account id / API token / Worker secret, and no
# Anthropic key, may ever be committed.
title = "Ask 214 secret scan"

[extend]
# Keep gitleaks' built-in rules (Anthropic sk-ant, generic high-entropy API keys, cloud tokens, etc.).
useDefault = true

[[rules]]
id = "cloudflare-account-id-in-config"
description = "A Cloudflare account_id (32-hex) assigned in a committed config file"
# Covers snake_case + camelCase, and the JSON ("account_id":), TOML (account_id:) and env
# (account_id=) forms; the optional quote after the key is what catches the wrangler.jsonc shape.
regex = '''(?i)account_?id["']?\s*[:=]\s*["']?[0-9a-f]{32}["']?'''
tags = ["cloudflare", "account"]

[allowlist]
description = "Generated/provenance data + lockfiles are public content, not secrets"
paths = [
  # 76 SHA-256 contentHash/cleanedHash provenance values + other corpus data (public gov content)
  '''content-ops/.*\.json''',
  '''static/corpus/.*''',
  '''pnpm-lock\.yaml''',
  # test fixtures may contain deliberately-fake tokens
  '''.*\.test\.ts''',
]
