name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (high+)
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Type check (content-ops build scripts)
        run: pnpm run check:content-ops

      - name: Validate sources registry (legal/schema gate)
        run: pnpm run validate:sources

      - name: Install Playwright browsers
        # webkit as well as chromium: it is the only engine available to us that shares a family with
        # Safari, and it covers what chromium structurally cannot - no `freeze` event, so
        # visibilitychange is the only relock signal, plus a stricter blob download handoff.
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Unit tests
        run: pnpm run test:unit -- --run

      - name: E2E tests (excludes @slow - the heavy offline-model run; see pnpm test:e2e:offline)
        run: pnpm exec playwright test --grep-invert @slow

      - name: Build
        run: pnpm run build

      - name: Bundle size check
        run: pnpm run check:bundle

      - name: Lighthouse CI
        run: pnpm exec lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: warn

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks - no committed secrets or Cloudflare account info
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
