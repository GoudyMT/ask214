name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # 30, not 15: a full green run through Lighthouse is ~12-14 min, and `playwright install --with-deps`
    # apt-downloads browser system libs from a mirror that is sometimes slow (a 15-min cap flaked on it).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (high+)
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Type check (content-ops build scripts)
        run: pnpm run check:content-ops

      - name: Type check (retrieve Worker)
        run: pnpm run check:worker

      - name: Validate sources registry (legal/schema gate)
        run: pnpm run validate:sources

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        # webkit as well as chromium: it is the only engine available to us that shares a family with
        # Safari, and it covers what chromium structurally cannot - no `freeze` event, so
        # visibilitychange is the only relock signal, plus a stricter blob download handoff.
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Unit tests
        run: pnpm run test:unit -- --run

      - name: E2E tests (excludes @slow - the heavy offline-model run; see pnpm test:e2e:offline)
        run: pnpm exec playwright test --grep-invert @slow

      - name: Build
        run: pnpm run build

      - name: Bundle size check
        run: pnpm run check:bundle

      - name: Lighthouse CI
        run: pnpm exec lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: warn

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # gitleaks-action@v2 lists the PR's commits through the API to scan them, which needs
    # pull-requests:read (checkout needs contents:read). The repo's default token is more restrictive,
    # so grant exactly those two here.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: gitleaks - no committed secrets or Cloudflare account info
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # gitleaks-action@v2 requires GITHUB_TOKEN to scan pull requests (breaking change); the
          # automatically-provisioned token is sufficient. No secret value is exposed by this.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
