name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so newly-published rules reach unchanged code.
    - cron: '23 4 * * 1'

# Cancel a superseded run when new commits land on the same ref (saves CI minutes).
concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan (semgrep OSS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The scan only reads the code. Findings stay in the job log - no code-scanning upload (that needs
    # paid Advanced Security on a private repo), so no security-events permission.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Semgrep OSS
        run: pip install semgrep

      - name: Scan
        # Blocking: --error exits non-zero on findings. Two rules are excluded as reviewed, intentional
        # policy: our pnpm minimumReleaseAge is a deliberate 24h floor for manual adds (Dependabot
        # already cools down 7 days), and npm's min-release-age key is inert for a pnpm-only project.
        # Code is never uploaded; --metrics=off sends no telemetry.
        run: >-
          semgrep scan --config p/default --metrics=off --error
          --exclude-rule package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
          --exclude-rule package_managers.npm.npm-missing-minimum-release-age.npm-missing-minimum-release-age
