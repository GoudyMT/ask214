name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan of unchanged code catches newly-published CodeQL queries.
    - cron: '23 4 * * 1'

# Cancel a superseded run when new commits land on the same ref (saves CI minutes).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CodeQL writes findings to the repo's code-scanning alerts (security-events:write);
    # checkout needs contents:read; actions:read lets CodeQL read the run. Scoped here,
    # not granted repo-wide.
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended: higher-recall security queries over the default suite,
          # no code-quality queries (noise for a security gate).
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
