version: 2
# The app is finished and kept as it is: routine version bumps are upkeep with no end, so a limit of 0 turns
# version updates off. Security updates are a repository setting with their own fixed limit, so they still arrive.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    # Wait 7 days after a release before proposing it (supply-chain caution; exceeds the 24h
    # minimumReleaseAge floor, so any version Dependabot proposes already satisfies the install guard).
    cooldown:
      default-days: 7
    # Held by hand: a new ONNX runtime only reaches a device through a renamed asset cache, which makes
    # every on-device user download the model and runtime again. Update it for a security fix or a need.
    ignore:
      - dependency-name: '@huggingface/transformers'
    groups:
      svelte:
        patterns:
          - '@sveltejs/*'
          - 'svelte'
          - 'svelte-*'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@playwright/*'
          - 'playwright'
          - 'vitest-*'
      linting:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
          - 'prettier'
          - 'prettier-*'
          - 'typescript-eslint'
      types:
        patterns:
          - '@types/*'
          - 'typescript'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    # Wait 7 days before proposing an action bump, matching the npm ecosystem's cooldown.
    cooldown:
      default-days: 7
