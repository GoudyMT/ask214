name = "military-transition-companion"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]

# Serve only on the ask214.com custom domain. The default *.workers.dev origin (and preview URLs, which
# follow this flag) would otherwise serve the same app under a second host whose security.txt Canonical
# points at a different origin (RFC 9116 mismatch), and split a privacy-first app across two origins.
workers_dev = false

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

# Per-IP rate limit for the feedback endpoint (atomic edge binding; no namespace resource to create).
# Verify with `wrangler dev` before deploy; the endpoint is guarded and works without it.
[[ratelimits]]
name = "FEEDBACK_LIMITER"
namespace_id = "2001"
simple = { limit = 3, period = 60 }
