<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Disable iOS / webview phone-number auto-linking app-wide: a model-written number in an AI summary
		     must never become a tappable tel: link (the CitedAnswer inert-prose contract, a scam-targeted audience). -->
		<meta name="format-detection" content="telephone=no" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/icon-192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="%sveltekit.assets%/icon-512.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<!-- Apply the persisted light/dark choice before first paint to avoid a flash of the wrong
		     palette. For System (or no stored choice) this sets no attribute - the prefers-color-scheme
		     media query resolves it. This inline script is hash-pinned in the CSP script-src (no unsafe-inline). -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem('mtc:theme');
					if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
				} catch (e) {}
			})();
		</script>
		<!-- Capture the PWA install prompt as early as possible: beforeinstallprompt can fire during
		     load (a returning visit with an already-active service worker) before the app hydrates, and
		     the browser fires it only once - stashing it here lets the install controller find it on init
		     instead of losing the race. Hash-pinned in the CSP script-src; recompute if the bytes change. -->
		<script>
			(function () {
				window.__installPrompt = null;
				window.addEventListener('beforeinstallprompt', function (e) {
					e.preventDefault();
					window.__installPrompt = e;
				});
				window.addEventListener('appinstalled', function () {
					window.__installPrompt = null;
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
