<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" font-family="Consolas, Menlo, monospace">
<title>How personal data is protected at rest: one encryption function into IndexedDB, keys optionally wrapped under a PIN, backups sealed with a passphrase</title>
<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#16325a" stroke-width="1"/></pattern>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9cc3ef"/></marker></defs>
<rect width="980" height="420" fill="#0d2240"/><rect width="980" height="420" fill="url(#g)"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#eaf3ff">Your data at rest</text>
<rect x="24" y="70" width="200" height="82" rx="6" fill="#123058" stroke="#9cc3ef" stroke-width="1.5"/>
<text x="36" y="92" font-size="14" font-weight="700" fill="#eaf3ff">A record</text>
<text x="36" y="112" font-size="12" fill="#b9d2ee">Profile, timeline state,</text>
<text x="36" y="129" font-size="12" fill="#b9d2ee">notes, calendar, API key</text>
<rect x="254" y="70" width="300" height="120" rx="6" fill="#123058" stroke="#9cc3ef" stroke-width="1.5"/>
<text x="266" y="92" font-size="14" font-weight="700" fill="#eaf3ff">encryptRecord()</text>
<text x="266" y="112" font-size="12" fill="#b9d2ee">AES-GCM, 256-bit key</text>
<text x="266" y="129" font-size="12" fill="#b9d2ee">Fresh random 12-byte IV per write</text>
<text x="266" y="146" font-size="12" fill="#b9d2ee">AAD binds store, record, write,</text>
<text x="266" y="163" font-size="12" fill="#b9d2ee">  schema and key record</text>
<text x="266" y="180" font-size="12" fill="#b9d2ee">A lint rule: no other way in</text>
<rect x="584" y="70" width="372" height="82" rx="6" fill="#123058" stroke="#9cc3ef" stroke-width="1.5"/>
<text x="596" y="92" font-size="14" font-weight="700" fill="#eaf3ff">IndexedDB</text>
<text x="596" y="112" font-size="12" fill="#b9d2ee">Ciphertext only; signed high-water marks</text>
<text x="596" y="129" font-size="12" fill="#b9d2ee">refuse an older copy</text>
<rect x="24" y="236" width="200" height="82" rx="6" fill="#123058" stroke="#9cc3ef" stroke-width="1.5"/>
<text x="36" y="258" font-size="14" font-weight="700" fill="#eaf3ff">Your PIN (optional)</text>
<text x="36" y="278" font-size="12" fill="#b9d2ee">4-6 digits; 3 free tries,</text>
<text x="36" y="295" font-size="12" fill="#b9d2ee">then waits up to 15 min</text>
<rect x="254" y="236" width="300" height="100" rx="6" fill="#123058" stroke="#9cc3ef" stroke-width="1.5"/>
<text x="266" y="258" font-size="14" font-weight="700" fill="#eaf3ff">Argon2id (128 MiB) then HKDF</text>
<text x="266" y="278" font-size="12" fill="#b9d2ee">Key 1 signs the key record</text>
<text x="266" y="295" font-size="12" fill="#b9d2ee">Key 2 (AES-KW) wraps the data keys</text>
<text x="266" y="312" font-size="12" fill="#b9d2ee">Unwrapped keys live in memory only</text>
<rect x="584" y="236" width="372" height="100" rx="6" fill="#123058" stroke="#9cc3ef" stroke-width="1.5"/>
<text x="596" y="258" font-size="14" font-weight="700" fill="#eaf3ff">Backup file</text>
<text x="596" y="278" font-size="12" fill="#b9d2ee">Six-word passphrase, Argon2id</text>
<text x="596" y="295" font-size="12" fill="#b9d2ee">One encrypted file you save</text>
<text x="596" y="312" font-size="12" fill="#b9d2ee">No account, nothing uploaded</text>
<path d="M224,110 L252,110" fill="none" stroke="#9cc3ef" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M554,110 L582,110" fill="none" stroke="#9cc3ef" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M224,276 L252,276" fill="none" stroke="#9cc3ef" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M404,236 L404,192" fill="none" stroke="#9cc3ef" stroke-width="1.6" marker-end="url(#a)"/>
<text x="412" y="222" font-size="12" fill="#ffd479">unlocks the keys</text>
<path d="M770,152 L770,234" fill="none" stroke="#9cc3ef" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="778" y="198" font-size="12" fill="#ffd479">exports</text>
<text x="24" y="380" font-size="12" fill="#b9d2ee">Lock, 15 minutes idle or a key change clears the keys from memory. Erase removes every store in one step.</text>
</svg>
