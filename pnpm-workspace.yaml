# Supply-chain guard: pnpm refuses to RESOLVE a dependency version published less than 1440 min (24h)
# ago, giving the ecosystem time to flag malicious releases. Gates resolution/updates (local
# pnpm add/update + Dependabot lockfile regen), NOT frozen-lockfile installs. Fail-closed by default.
minimumReleaseAge: 1440

allowBuilds:
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  workerd: false

# Force the patched tmp across the dependency tree (transitive via @lhci/cli).
# GHSA-ph9p-34f9-6g65 (Path Traversal, high). Floor pin - future patches satisfy it.
# Retire when @lhci/cli bundles tmp>=0.2.6 natively (Dependabot will surface it).
#
# Force patched ws + undici (deep transitives via wrangler>miniflare; ws also via @vitest/browser).
# Dev/deploy-only - neither ships in the client bundle. GHSA-96hv-2xvq-fx4p (ws DoS, high);
# GHSA-vmh5-mc38-953g + GHSA-vxpw-j846-p89q (undici TLS-bypass + WS DoS) + GHSA-4cwx-7wf7-3272 (undici
# cross-user disclosure + parse-time crash, the >=8.0.0 <8.9.0 range), all high -> undici floor then
# >=8.9.0; GHSA-rfgv-xxqx-mfg5 + GHSA-w293-vg96-wgc3 + GHSA-vp8m-p9jh-q5pm (undici WebSocket-subprotocol DoS,
# BalancedPool TLS-validation bypass, interceptor cross-origin cache poisoning; up to <8.10.2), all high ->
# undici floor now >=8.10.2. Floor pins - retire when wrangler/miniflare bundle them natively (Dependabot will
# surface it).
overrides:
  tmp: '>=0.2.6'
  ws: '>=8.21.0'
  undici: '>=8.10.2'
  # Force patched nanoid (GHSA-2v37-7h3g-55p8, custom generators loop forever on size 0, high; transitive
  # dev/build-only via vite>postcss, never in the client bundle). Floor pin.
  nanoid: '>=3.3.17'
  # Force patched js-yaml / adm-zip / sharp across the tree (transitive via @lhci/cli, transformers'
  # onnxruntime-node, and transformers + wrangler>miniflare). Dev/build/test-only - none ship in the
  # client bundle. GHSA-52cp-r559-cp3m + GHSA-5p4m-2wfm-xmqj + GHSA-2883-xcg3-v3hh (js-yaml quadratic CPU,
  # then empty merge sources defeating maxTotalMergeKeys); GHSA-xcpc-8h2w-3j85 + GHSA-7q85-xj36-vmfc (adm-zip
  # 4GB alloc, then allocation sized by the declared uncompressed size);
  # GHSA-f88m-g3jw-g9cj + GHSA-rgj7-g3m4-5g8c (sharp/libvips CVEs), then GHSA-wq5f-xc86-pv6w (sharp's librsvg,
  # CVE-2026-96889, up to <0.35.5). Targeted range pins - only the
  # vulnerable ranges are bumped, so any patched consumer is left alone. Retire when the parents bundle
  # the patched versions natively (Dependabot will surface it).
  #
  # js-yaml, sharp and adm-zip each moved forward one patch when a LATER advisory widened the vulnerable range past
  # the version the previous pin had landed on. A pin is only ever correct for the advisory it was written
  # against, so re-read the range - never assume an existing pin still clears a new finding on the same
  # package.
  'js-yaml@<3.15.2': '3.15.2'
  'adm-zip@<0.6.1': '0.6.1'
  'sharp@<0.35.5': '0.35.5'
  # Force patched brace-expansion (GHSA-mh99-v99m-4gvg + GHSA-rgw5-rvv9-x895, DoS via unbounded expansion -> OOM crash, high;
  # transitive dev/build-only via eslint>minimatch@10 and @lhci/cli>rimraf>glob>minimatch@3, never in
  # the client bundle). Blanket floor, NOT a scoped 5.0.x pin, because pnpm's advisory range (<=5.0.7)
  # flags even the older brace-expansion@1.1.16 on the minimatch@3 chain, so a scoped pin that leaves 1.x
  # in place keeps the audit red (verified empirically). The accepted cost: this floor also lifts
  # minimatch@3's brace-expansion to a 5.x major whose CommonJS is a named export, which minimatch@3
  # calls as a function - so a BRACE glob routed through that lhci chain would throw. That path is
  # dev-only AND dormant (lhci's rimraf/glob operate on brace-less temp paths; the build + lighthouse CI
  # gates pass). Retire when @lhci/cli's chain bundles a patched, minimatch@3-compatible brace-expansion.
  # Raised to >=5.0.11 for GHSA-6j4f-fj2g-mc7p + GHSA-qhr7-859c-m2p7 (stack exhaustion through uncontrolled
  # recursion - in parseCommaParts, and on nested brace groups - high; the ranges run to <5.0.10 and <5.0.11).
  brace-expansion: '>=5.0.11'
  # Force patched ip-address (GHSA-mwp4-54f8-5fhr, SSRF + trust-boundary bypass via leading-zero octets
  # decoded as decimal, high; transitive dev-only via @lhci/cli>lighthouse>puppeteer-core>...>socks>
  # ip-address, never in the client bundle). Floor pin - retire when that chain bundles >=10.3.1.
  ip-address: '>=10.3.1'
  # Force patched devalue (GHSA-j22f-vq7h-c4qm, `stringify`/`uneval` serialize shared memory; GHSA-mcm9-63f2-9j32,
  # repeated primitive strings expand quadratically in `uneval`; GHSA-x5rw-q4pp-hg5g, `stringifyAsync` can leave an
  # unhandled rejection - all high, all up to <=5.9.2). Unlike every pin above, devalue SHIPS: it is SvelteKit's
  # serializer (via @sveltejs/kit and svelte) in the live worker and the client bundle. Targeted range pin to the
  # newest 5.9.x, so the patch stays inside the minor SvelteKit was built against and a consumer that already
  # resolves a patched devalue is left alone. Retire when the lockfile resolves >=5.9.3 without it.
  'devalue@<5.9.3': '5.9.4'
  # Force patched basic-ftp (GHSA-c475-qrg2-pj4r, quadratic CPU in the Unix directory-listing parser, high, up to
  # <=6.2.0; transitive dev-only via @lhci/cli>...>proxy-agent>pac-proxy-agent>get-uri, never in the client
  # bundle). The patch exists only in 6.x and every get-uri release asks for ^5, so this floor crosses a major,
  # as the brace-expansion pin does. The accepted cost: get-uri's FTP path may not work with 6.x. That path only
  # fetches a proxy auto-config file from an ftp: address, which Lighthouse CI never uses; the Lighthouse gate
  # proves the chain still loads. Retire when get-uri accepts a patched basic-ftp (Dependabot will surface it).
  basic-ftp: '>=6.2.1'
  # Force patched proxy-addr (GHSA-jqcg-44mw-7w3h, IP spoofing through an IPv4-mapped IPv6 trust subnet, critical)
  # and compression (GHSA-vc2v-76pw-4v95, memory-leak DoS on a premature response close, high); both transitive
  # dev-only via @lhci/cli (proxy-addr through express), never in the client bundle. Targeted range pins: each
  # patch sits inside the minor its parent asks for. Retire when @lhci/cli resolves them natively.
  'proxy-addr@<2.0.8': '2.0.8'
  'compression@<1.8.2': '1.8.2'
  # Force patched source-map-js (GHSA-68fv-2mgg-jv7q, event-loop DoS through indexed source-map section offsets,
  # high; transitive build-only via vite>postcss, never in the client bundle). Targeted range pin, inside the
  # ^1.2.1 postcss asks for. Retire when the lockfile resolves >=1.2.2 without it.
  'source-map-js@<1.2.2': '1.2.2'

# Accepted, unfixable, dev/CI-only advisories (never shipped in the client bundle): extract-zip
# (GHSA-jmr9-qjv8-65gv / CVE-2026-56876, symlink path traversal, CVSS 8.6; and GHSA-7pqw-9j4j-h8q3,
# arbitrary file writes through symlink archive entries - the same class, reported separately).
# extract-zip is frozen at 2.0.1 since 2020. The second advisory names ">=2.0.2" as patched, but no such
# version is published - the registry's newest is 2.0.1 - so there is still nothing to pin, and the
# advisory's own patched-version field cannot be taken at face value.
#
# It is a deep transitive of the Lighthouse-CI dev tool (@lhci/cli>lighthouse>puppeteer-core>
# @puppeteer/browsers); its only job there is unpacking the Chrome archive @puppeteer/browsers downloads
# from Google over HTTPS - a trusted source, never attacker-controlled input, and never in the client
# bundle. Both entries are scoped to THEIR OWN GHSA: every other high/critical still fails
# `pnpm audit --audit-level=high`. Retire when the chain drops extract-zip (a @puppeteer/browsers>=3.0.6
# bump replaced it with yauzl; Dependabot will surface it) or a real patch ships.
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
